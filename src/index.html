<body>
  <bn-context>
    <bn-datasource name="test">
      [
        {"setname": "de", "operation": "-", "rowgroup": "Kosten", "category": "lime", "subcategory": "lime", "ac": -1, "py": -7, "fc": -6, "pl": -13},

    <bn-page format="a4" orientation="landscape">

        date-start='2019-01-12'
        date-end='2021-05-12'

      </bn-title>
      <bn-body>
      <bn-text left="250px" top="500px" value="Hallo Test ${this.test.a}"></bn-text>
        <bn-table

          top='200px'
          left='400px'
          grouped="false"
          show-group-title='true'
          table-title='title1'
          scenarios='ac,fc,py'
          type='SUM'
          limit='40'
          order='ac'
          order-direction='desc'
          thereof='[
          {
            "rowgroup":"Umsatz",
            "category": "Applications",
            "subcategory": "Applications-A",
            "partof": "category"
          },
          {
            "rowgroup": "Umsatz",

            "partof": "rowgroup"
          }]'
