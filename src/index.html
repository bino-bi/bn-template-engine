<!DOCTYPE html>
<html dir="ltr" lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0">
  <title>Stencil Component Starter</title>
  <script type="module" src="/build/bn-template-engine.esm.js"></script>
  <script nomodule src="/build/bn-template-engine.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body>
<bn-context>
  <bn-data name="test">
    [
    {"a":1},
    {"a":2},
    {"a":3},
    {"a":4}
    ]
  </bn-data>
  <bn-dataset name="abc" datasources="test">
    SELECT SUM(a) AS `sum` FROM test
  </bn-dataset>

  <bn-page format="a3" orienation="portrait">
    <bn-text datasets="abc" value="Hallo ${this.abc[0].sum}"></bn-text>
  </bn-page>
</bn-context>
</body>
</html>
