<!DOCTYPE html>
<html dir="ltr" lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0">
  <title>Stencil Component Starter</title>
  <script type="module" src="/build/bn-template-engine.esm.js"></script>
  <script nomodule src="/build/bn-template-engine.js"></script>
</head>
<body>
  <bn-template template-id="test" version="1.0">
    <bn-datasource></bn-datasource>
    <bn-page format="a4" orientation="landscape">
      <bn-title
        business-unit = 'BinoBI Racing'   
        measures      = '[{"name": "Bruttoumsatz", "unit": "mEUR"}]'
        scenarios     = 'ac,fc,pl,py'
       
        order         = 'category,ac,py'
        order-direction='asc'
  

       
        date-start='2020-01-12'
        date-end='2020-05-12'
        date-format = 'quarter'
        date-link = 'interval'
      >       
      </bn-title>    
     
     
        <bn-table        
          grouped="false" 
          show-group-title='true'
          table-title='title1' 
          scenarios='ac,fc,py'
          type='SUM'
          limit='40'
          order='ac'
          order-direction='desc'
          thereof='[
          {
            "rowgroup":"Umsatz", 
            "category": "Applications", 
            "subcategory": "Applications-A",
            "partof": "category"
          },
          {
            "rowgroup": "Umsatz",
            "category": "Applications",
            "subcategory": "Applications-B",
            "partof": "rowgroup"
          }]'
        ></bn-table>
        <bn-chart      
          width = '400'
          height = '300'
          scenarios = 'ac,py,fc,ac1'
          variances = 'null'
          hideCategories = true
          pixelPerUnit = 20>         
        </bn-chart>
        <bn-chart      
        width = '400'
        height = '300'
        scenarios = 'ac,fc,py,pl'
        variances = 'dpy_ac_pos'
        hideCategories = true
        pixelPerUnit =  20     
      >         
      </bn-chart>
        
        <!-- <bn-text left="250px" top="500px" value="Hallo Test ${this.config.measures[0].name}"/> -->
      </bn-body>
      <bn-footer>
        Footer
      </bn-footer>
    </bn-page>
  </bn-template>
</body>
</html>
