name: Snapshot
on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3.2.0
      - name: Setup node
        uses: actions/setup-node@v3
        with:
          node-version: 18
          registry-url: "https://npm.pkg.github.com"
          scope: "@bino-bi"
          always-auth: true
          token: ${{ secrets.GH_REGISTRY_PACKAGES }}
          cache: "npm"
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_REGISTRY_PACKAGES }}
      - name: Run build
        run: npm run build
      - name: Upload to stoage
        uses: mamal72/minio-perfect-deploy-action@main
        with:
          endpoint: ${{ secrets.STORAGE_ENDPOINT }}
          access_key: ${{ secrets.STORAGE_ACCESS_KEY }}
          secret_key: ${{ secrets.STORAGE_SECRET_KEY }}
          bucket: "cdn"
          source_dir: "dist/bn-template-engine"
          target_dir: "/bn-template-engine/SNAPSHOT"
