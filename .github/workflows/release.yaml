name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build, Publish & Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: npm

      # npm trusted publishing (OIDC) requires npm 11.5.1+; Node 22 bundles npm 10
      - run: npm install -g npm@^11.5.1

      - run: npm ci

      - name: Set version from tag
        run: npm version "${GITHUB_REF#refs/tags/v}" --no-git-tag-version

      - run: npm run build

      - name: Get version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          if [[ "$VERSION" == *-* ]]; then
            echo "PRERELEASE=true" >> $GITHUB_OUTPUT
          else
            echo "PRERELEASE=false" >> $GITHUB_OUTPUT
          fi

      - name: Determine npm dist-tag
        id: dist-tag
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          if [[ "$TAG_VERSION" == *"-alpha"* ]]; then
            echo "TAG=alpha" >> $GITHUB_OUTPUT
          elif [[ "$TAG_VERSION" == *"-beta"* ]]; then
            echo "TAG=beta" >> $GITHUB_OUTPUT
          elif [[ "$TAG_VERSION" == *"-rc"* ]]; then
            echo "TAG=rc" >> $GITHUB_OUTPUT
          elif [[ "$TAG_VERSION" == *"-"* ]]; then
            echo "TAG=next" >> $GITHUB_OUTPUT
          else
            echo "TAG=latest" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npm
        # auth via npm trusted publishing (OIDC); provenance is generated automatically
        run: npm publish --tag ${{ steps.dist-tag.outputs.TAG }} --access public

      - name: Zip dist
        run: |
          cd dist
          zip -r ../bn-template-engine-${{ steps.version.outputs.VERSION }}.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: Release ${{ steps.version.outputs.VERSION }}
          prerelease: ${{ steps.version.outputs.PRERELEASE == 'true' }}
          generate_release_notes: true
          files: bn-template-engine-${{ steps.version.outputs.VERSION }}.zip

      - name: Checkout releases repository
        uses: actions/checkout@v7
        with:
          repository: bino-bi/bn-template-engine-releases
          token: ${{ secrets.GH_RELEASES_TOKEN }}
          path: releases-repo

      - name: Create release in releases repository
        uses: softprops/action-gh-release@v3
        with:
          repository: bino-bi/bn-template-engine-releases
          token: ${{ secrets.GH_RELEASES_TOKEN }}
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: Release ${{ steps.version.outputs.VERSION }}
          body: |
            Release ${{ steps.version.outputs.VERSION }} of bn-template-engine

            Built from: ${{ github.repository }}@${{ github.sha }}
          files: bn-template-engine-${{ steps.version.outputs.VERSION }}.zip
          draft: false
          prerelease: ${{ steps.version.outputs.PRERELEASE == 'true' }}
